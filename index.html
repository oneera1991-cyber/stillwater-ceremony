<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stillwater Universe — AI Reading Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#09081a;
  --panel:rgba(20,17,46,.78);
  --panel2:rgba(8,7,24,.55);
  --line:rgba(220,210,255,.16);
  --text:#f4f0ff;
  --muted:#b9b2d0;
  --accent:#d9c8ff;
  --accent2:#eee8ff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(116,88,210,.23),
      transparent 38%
    ),
    radial-gradient(
      circle at 20% 80%,
      rgba(70,110,190,.12),
      transparent 35%
    ),
    var(--bg);

  font-family:"Anuphan",sans-serif;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.035) 0 1px,transparent 2px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.025) 0 1px,transparent 2px);

  background-size:170px 170px,230px 230px;

  opacity:.7;
}

.wrap{
  position:relative;
  z-index:1;

  width:100%;
  max-width:1080px;

  margin:auto;

  padding:
    45px 20px 80px;
}

/* =========================
   BRAND
========================= */

.brand{
  text-align:center;

  font-family:"Cormorant Garamond",serif;
  font-size:clamp(38px,8vw,68px);
  font-weight:300;

  letter-spacing:.18em;
  line-height:1;
}

.sub{
  text-align:center;

  margin:
    12px 0 38px;

  color:var(--muted);

  font-size:13px;
  letter-spacing:.12em;
}

/* =========================
   MAIN PANEL
========================= */

.panel{

  border:
    1px solid var(--line);

  background:
    var(--panel);

  backdrop-filter:
    blur(18px);

  border-radius:
    24px;

  padding:
    25px;

  box-shadow:
    0 20px 80px rgba(0,0,0,.28);
}

label{

  display:block;

  color:var(--muted);

  font-size:13px;

  margin-bottom:9px;
}

textarea{

  width:100%;

  min-height:135px;

  resize:vertical;

  border:
    1px solid var(--line);

  border-radius:
    17px;

  background:
    rgba(5,4,18,.68);

  color:var(--text);

  padding:
    17px;

  font-family:"Anuphan",sans-serif;

  font-size:16px;

  line-height:1.75;

  outline:none;

  transition:.25s;
}

textarea:focus{

  border-color:
    rgba(217,200,255,.55);

  box-shadow:
    0 0 0 3px rgba(217,200,255,.05);
}

textarea::placeholder{
  color:#77718c;
}

/* =========================
   BUTTON
========================= */

.actions{

  display:flex;

  gap:12px;

  align-items:center;

  flex-wrap:wrap;

  margin-top:15px;
}

button{

  border:
    1px solid rgba(230,220,255,.3);

  border-radius:
    999px;

  padding:
    12px 24px;

  color:
    #161126;

  background:
    var(--accent2);

  font-family:"Anuphan",sans-serif;

  font-size:15px;

  font-weight:500;

  cursor:pointer;

  transition:.2s;
}

button:hover{

  transform:
    translateY(-1px);

  box-shadow:
    0 8px 25px rgba(200,180,255,.15);
}

button:disabled{

  opacity:.45;

  cursor:wait;

  transform:none;
}

.hint{

  font-size:12px;

  color:var(--muted);
}

/* =========================
   STATUS
========================= */

.status{

  margin-top:16px;

  padding:12px 14px;

  border-radius:14px;

  background:
    rgba(255,255,255,.035);

  color:var(--muted);

  font-size:13px;

  line-height:1.6;
}

.error{

  color:#ffb8c7;
}

/* =========================
   RESULT
========================= */

.hidden{
  display:none !important;
}

.result{

  margin-top:20px;
}

.grid{

  display:grid;

  grid-template-columns:
    300px 1fr;

  gap:18px;
}

/* =========================
   CARD
========================= */

.cardbox,
.readbox{

  border:
    1px solid var(--line);

  border-radius:
    22px;

  background:
    var(--panel2);

  padding:
    18px;
}

.cardbox{

  align-self:start;
}

.card-image-wrap{

  position:relative;

  overflow:hidden;

  border-radius:16px;

  background:#15112b;
}

.cardbox img{

  display:block;

  width:100%;

  aspect-ratio:2 / 3;

  object-fit:cover;

  border-radius:16px;
}

.card-fallback{

  display:none;

  aspect-ratio:2 / 3;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:30px;

  color:var(--muted);

  font-size:13px;
}

.cardname{

  text-align:center;

  margin-top:14px;

  font-family:
    "Cormorant Garamond",serif;

  font-size:30px;

  font-weight:400;
}

.section-title{

  margin-bottom:13px;

  color:var(--accent);

  font-size:11px;

  letter-spacing:.16em;
}

/* =========================
   ANALYSIS
========================= */

.analysis{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.kv{

  border:
    1px solid var(--line);

  border-radius:
    14px;

  padding:
    12px;

  background:
    rgba(255,255,255,.025);
}

.k{

  margin-bottom:4px;

  color:var(--muted);

  font-size:11px;
}

.v{

  color:var(--text);

  font-size:14px;

  line-height:1.55;
}

.signal{

  margin-top:11px;

  color:#dcd5ec;

  font-size:13px;

  line-height:1.7;
}

/* =========================
   READING
========================= */

.reading{

  white-space:pre-wrap;

  color:#f5f1ff;

  font-size:16px;

  line-height:1.95;
}

/* =========================
   COST
========================= */

.cost{

  margin-top:25px;

  padding-top:15px;

  border-top:
    1px solid var(--line);

  color:var(--muted);

  font-size:12px;

  line-height:1.8;
}

.cost strong{

  color:var(--accent);
}

/* =========================
   FOOTER NOTE
========================= */

.lab-note{

  margin-top:22px;

  text-align:center;

  color:#706a83;

  font-size:11px;

  line-height:1.7;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .wrap{
    padding:
      35px 15px 60px;
  }

  .panel{
    padding:18px;
    border-radius:20px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .cardbox{
    max-width:285px;
    width:100%;
    margin:auto;
  }

  .analysis{
    grid-template-columns:1fr;
  }

  .reading{
    font-size:15.5px;
    line-height:1.9;
  }

}

</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    STILLWATER
  </div>

  <div class="sub">
    UNIVERSE · AI READING LAB
  </div>


  <!-- =========================
       QUESTION
  ========================== -->

  <div class="panel">

    <label for="question">
      คำถามของคุณ
    </label>

    <textarea
      id="question"
      maxlength="1200"
      placeholder="เขียนคำถามที่คุณอยากรู้จริง ๆ ได้เลย...&#10;&#10;เช่น เขาไม่ตอบฉันมา 4 วันแล้ว แต่ยังดูสตอรี่ทุกวัน ฉันควรรอเขาไหม"
    ></textarea>

    <div class="actions">

      <button id="askBtn">
        ✦ ASK VERA
      </button>

      <span class="hint">
        AI Reading Prototype · Internal Test
      </span>

    </div>

    <div
      id="status"
      class="status hidden">
    </div>

  </div>


  <!-- =========================
       RESULT
  ========================== -->

  <div
    id="result"
    class="result hidden">

    <div class="grid">


      <!-- CARD -->

      <div class="cardbox">

        <div class="section-title">
          CARD DRAW
        </div>

        <div class="card-image-wrap">

          <img
            id="cardImg"
            alt="Tarot card"
          >

          <div
            id="cardFallback"
            class="card-fallback">
            ไม่พบรูปไพ่<br>
            แต่ระบบยังสามารถอ่านไพ่ได้
          </div>

        </div>

        <div
          id="cardName"
          class="cardname">
        </div>

      </div>


      <!-- READING -->

      <div class="readbox">

        <div class="section-title">
          AI QUESTION ANALYSIS
        </div>

        <div
          id="analysis"
          class="analysis">
        </div>

        <div
          id="signals"
          class="signal">
        </div>


        <div
          style="margin-top:27px"
          class="section-title">

          VERA'S READING

        </div>

        <div
          id="reading"
          class="reading">
        </div>


        <div
          id="cost"
          class="cost">
        </div>

      </div>

    </div>

  </div>


  <div class="lab-note">

    Stillwater Universe AI Lab · Prototype only<br>
    ไม่มีการชำระเงิน · ไม่มีการเก็บข้อมูลลูกค้า · ยังไม่ใช่ระบบขายจริง

  </div>

</div>


<script>

/* =========================================
   BASIC HELPERS
========================================= */

const $ = (id) =>
  document.getElementById(id);


const askBtn =
  $("askBtn");


/* =========================================
   ASK VERA
========================================= */

askBtn.addEventListener(
  "click",
  async () => {

    const question =
      $("question")
      .value
      .trim();


    if(!question){

      $("question").focus();

      return;
    }


    askBtn.disabled =
      true;


    $("result")
      .classList
      .add("hidden");


    $("status")
      .classList
      .remove("hidden");


    $("status")
      .textContent =
      "พี่เวรากำลังฟังคำถามของคุณ…";


    try{

      const response =
        await fetch(
          "/api/read",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                question
              })
          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "ระบบไม่สามารถอ่านคำถามได้"
        );

      }


      /* =========================
         STATUS
      ========================== */

      $("status")
        .textContent =
        "พี่เวราอ่านคำถามเสร็จแล้ว";


      /* =========================
         ANALYSIS
      ========================== */

      const analysis =
        data.analysis;


      $("analysis")
        .innerHTML = `

          <div class="kv">

            <div class="k">
              เจตนาหลัก
            </div>

            <div class="v">
              ${escapeHtml(
                analysis.intent
              )}
            </div>

          </div>


          <div class="kv">

            <div class="k">
              อารมณ์
            </div>

            <div class="v">
              ${escapeHtml(
                analysis.emotional_state
              )}
            </div>

          </div>


          <div class="kv">

            <div class="k">
              ระดับอารมณ์
            </div>

            <div class="v">
              ${escapeHtml(
                analysis.emotional_intensity
              )}
            </div>

          </div>


          <div class="kv">

            <div class="k">
              สถานการณ์
            </div>

            <div class="v">
              ${escapeHtml(
                analysis.situation
              )}
            </div>

          </div>


          <div class="kv">

            <div class="k">
              ความต้องการลึก ๆ
            </div>

            <div class="v">
              ${escapeHtml(
                analysis.core_need
              )}
            </div>

          </div>


          <div class="kv">

            <div class="k">
              มุมที่ควรอ่าน
            </div>

            <div class="v">
              ${escapeHtml(
                analysis.reading_angle
              )}
            </div>

          </div>

        `;


      const signals =
        Array.isArray(
          analysis.key_signals
        )
        ? analysis.key_signals.join(" · ")
        : "";


      $("signals")
        .innerHTML =
        "<strong>สัญญาณที่จับได้:</strong> "
        +
        escapeHtml(signals);


      /* =========================
         CARD
      ========================== */

      $("cardName")
        .textContent =
        data.card.name;


      const image =
        $("cardImg");


      const fallback =
        $("cardFallback");


      image.style.display =
        "block";


      fallback.style.display =
        "none";


      image.src =
        data.card.image;


      image.onload =
        () => {

          image.style.display =
            "block";

          fallback.style.display =
            "none";

        };


      image.onerror =
        () => {

          image.style.display =
            "none";

          fallback.style.display =
            "flex";

        };


      /* =========================
         READING
      ========================== */

      $("reading")
        .textContent =
        data.reading;


      /* =========================
         COST
      ========================== */

      const usage =
        data.usage || {};


      const estimated =
        Number(
          usage.estimated_usd || 0
        );


      $("cost")
        .innerHTML = `

          <strong>
            AI TEST COST
          </strong>

          <br>

          วิเคราะห์คำถาม:
          ${usage.analysis_input_tokens ?? "-"}
          input +
          ${usage.analysis_output_tokens ?? "-"}
          output tokens

          <br>

          อ่านไพ่:
          ${usage.reading_input_tokens ?? "-"}
          input +
          ${usage.reading_output_tokens ?? "-"}
          output tokens

          <br>

          รวม:
          ${usage.total_tokens ?? "-"}
          tokens

          <br>

          ค่า AI โดยประมาณ:
          $${estimated.toFixed(6)}

          <br><br>

          <span>
            เพดานตอนนี้:
            Analysis 300 tokens ·
            Free Reading 500 tokens
          </span>

        `;


      /* =========================
         SHOW
      ========================== */

      $("result")
        .classList
        .remove("hidden");


      window.scrollTo({
        top:
          $("result")
          .offsetTop - 20,

        behavior:
          "smooth"
      });


    }catch(error){

      $("status")
        .innerHTML =
        `<span class="error">
          ${escapeHtml(
            error.message
          )}
        </span>`;

    }finally{

      askBtn.disabled =
        false;

    }

  }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    (character) => {

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character];

    }
  );

}

</script>

</body>
</html>
